name: Refresh S&P 500 data

on:
  schedule:
    # 22:30 UTC on weekdays = 5:30pm ET (winter) / 6:30pm ET (summer), after the close
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data and compute metrics
        run: python -u scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/metrics.json data/fundamentals.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh data for $(date -u +%Y-%m-%d)"
            git push
          fi
